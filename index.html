<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6fb">
    <meta name="description" content="플래시카드와 객관식 퀴즈로 공부하는 TEPS 단어장">
    <title>단어 암기</title>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./words.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="shell">
      <h1 class="visually-hidden">단어 암기</h1>
      <!-- 윗줄은 아래 두 칸(학습 화면 · 사이드바)과 같은 격자를 쓴다. 모드 전환은 학습 카드의 왼쪽 끝에, 단어장 막대는 사이드바 너비에 맞춘다. -->
      <header class="toolbar">
        <nav class="mode-switch" aria-label="학습 모드">
          <button type="button" data-mode="cards" aria-pressed="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8.5" y="3" width="12" height="15" rx="2.4"/><path d="M5 6.8v11.5A2.7 2.7 0 0 0 7.7 21H16"/></svg>플래시카드
          </button>
          <button type="button" data-mode="quiz" aria-pressed="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="7" height="7" rx="1.9"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.9"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.9"/><path d="m13.6 17.1 2.3 2.3 4.4-4.6"/></svg>퀴즈
          </button>
        </nav>
        <!-- 단어 가져오기: 데이터베이스를 붙이기 전까지 화면에서 감춘다. app.js의 IMPORT_ENABLED로 다시 켠다. -->
        <button type="button" class="import-button" id="open-import" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5v11m-4.5-4.5 4.5 4.5 4.5-4.5"/><path d="M4.5 16.5v2A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg>단어 가져오기
        </button>
      </header>

      <div class="workspace">
        <section id="study" aria-label="학습 화면" tabindex="-1"></section>
        <aside class="sidebar" aria-label="학습 보조 정보">
          <section class="side-panel quiz-panel" id="quiz-panel" hidden>
            <h2>이번 퀴즈</h2>
            <dl class="quiz-stats" id="quiz-stats"></dl>
          </section>
          <section class="side-panel">
            <div class="panel-head"><h2>암기 현황</h2><span class="panel-meta" id="deck-label"></span></div>
            <div class="mastery-details">
              <div class="mastery-ring" id="mastery-ring" aria-hidden="true"><span id="mastery-percent">0%</span></div>
              <div>
                <p class="mastery-count" id="mastery-count"></p>
                <p class="muted">암기한 단어</p>
                <button type="button" class="text-button" id="reset-mastery" hidden>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/></svg>처음부터 다시
                </button>
              </div>
            </div>
          </section>
          <section class="side-panel shortcuts">
            <h2>키보드 단축키</h2>
            <dl id="shortcut-list"></dl>
          </section>
        </aside>
      </div>
      <p id="announcement" class="visually-hidden" role="status"></p>
      <p id="storage-notice" class="storage-notice" role="status" hidden></p>
      <div class="toast" id="toast" hidden>
        <span id="toast-text"></span>
        <button type="button" class="toast-undo" id="toast-undo">되돌리기</button>
      </div>
      <noscript>플래시카드와 퀴즈를 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
    </main>

    <dialog id="import-dialog" aria-labelledby="import-title">
      <form id="import-form">
        <header class="dialog-heading">
          <h2 id="import-title">단어 가져오기</h2>
          <button type="button" class="icon-button" id="close-import" aria-label="닫기">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 6.5l11 11m0-11-11 11"/></svg>
          </button>
        </header>
        <p class="muted">JSON을 붙여넣거나 파일을 선택하세요. 적용하면 현재 단어장이 교체됩니다.</p>
        <label for="word-file" class="field-label">JSON 파일</label>
        <input type="file" id="word-file" accept=".json,application/json">
        <label for="word-input" class="field-label">단어 목록</label>
        <textarea id="word-input" rows="6" spellcheck="false" placeholder='[
  {"word": "영어 단어", "meaning": "한국어 뜻", "description": "설명문"}
]'></textarea>
        <p id="import-error" class="import-error" role="alert" hidden></p>
        <div class="dialog-actions"><button class="button primary" id="apply-deck">단어장 적용</button></div>
      </form>
    </dialog>
  </body>
</html>
